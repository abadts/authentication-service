spring:
  datasource:
    url: jdbc:h2:mem:authentication-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

security:
  oauth2:
    service-client:
      secret: test-service-secret
  jwt:
    private-key-location: classpath:keys/test-private-key.pem
    public-key-location: classpath:keys/test-public-key.pem

logging:
  level:
    root: WARN
    org.springframework.security: WARN
